{% extends 'layouts/base.html' %}

{% block content %}
{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Pagos - {{ credito.cliente }}</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>  
    <link href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.2.0/fullcalendar.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.2.0/fullcalendar.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <h1 class="text-center mt-6 text-3xl font-bold text-slate-900">Calendario de Pagos de {{ credito.cliente.nombres }} {{ credito.cliente.apellidos }}</h1>

    <div id="calendar" class="max-w-4xl mx-auto mt-8 bg-white shadow-lg rounded-lg p-6"></div>

    <div class="max-w-4xl mx-auto mt-4 flex justify-center space-x-4">
        <div class="flex items-center">
            <div class="w-4 h-4 bg-blue-500 rounded-full mr-2"></div>
            <span>Pendiente</span>
        </div>
        <div class="flex items-center">
            <div class="w-4 h-4 bg-red-500 rounded-full mr-2"></div>
            <span>Vencido</span>
        </div>
        <div class="flex items-center">
            <div class="w-4 h-4 bg-green-500 rounded-full mr-2"></div>
            <span>Pagado</span>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            var eventos = JSON.parse('{{ eventos_json|escapejs }}');  // Asegúrate de que los datos JSON sean válidos

            $('#calendar').fullCalendar({
                events: eventos,  // Usamos la variable eventos que ya está parseada
                editable: false,  // Deshabilitar edición
                droppable: false,  // No permitir arrastrar eventos
                header: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'month,agendaWeek,agendaDay'
                },
                eventRender: function(event, element) {
                    element.attr('title', event.title);  // Mostrar título del evento en el tooltip
                    // Añadir la clase según el color del evento usando Tailwind
                    if (event.color === 'green') {
                        element.css('background-color', '#a7f3d0'); // Verde claro para pagado
                        element.css('color', '#166534'); // Texto verde oscuro
                    } else if (event.color === 'red') {
                        element.css('background-color', '#fecaca'); // Rojo claro para vencido
                        element.css('color', '#b91c1c'); // Texto rojo oscuro
                    } else if (event.color === 'blue') {
                        element.css('background-color', '#bfdbfe'); // Azul claro para pendiente
                        element.css('color', '#1e40af'); // Texto azul oscuro
                    }
                    element.addClass('rounded-lg p-2 text-sm'); // Estilo general para los eventos
                }
            });
        });
    </script>
</body>
</html>

{% endblock %}
