{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}
<div class="bg-gray-50 min-h-screen py-8">
    <div class="max-w-5xl mx-auto px-4">
        <h1 class="text-center mb-8 text-3xl font-light text-slate-800 tracking-tight">
            Calendario de Pagos: <span class="font-semibold">{{ credito.cliente.nombres }} {{ credito.cliente.apellidos }}</span>
        </h1>

        <div class="bg-white shadow-sm border border-gray-200 rounded-xl p-6">
            <div id="calendar"></div>
        </div>

        <div class="mt-6 flex justify-center gap-6 text-xs uppercase tracking-widest text-gray-500 font-medium">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 bg-blue-500 rounded-full"></span> Pendiente
            </div>
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 bg-red-500 rounded-full"></span> Vencido
            </div>
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 bg-green-500 rounded-full"></span> Pagado
            </div>
        </div>
    </div>
</div>

<link href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.2.0/fullcalendar.min.css" rel="stylesheet">
<style>
    .fc-unthemed td.fc-today { background: #f8fafc; }
    .fc-header-title h2 { font-size: 1.25rem !important; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .fc-button { background: white !important; border: 1px solid #e2e8f0 !important; box-shadow: none !important; text-shadow: none !important; color: #64748b !important; }
    .fc-state-active { background: #f1f5f9 !important; color: #1e293b !important; }
    .fc-event { border: none !important; padding: 2px 5px !important; }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.2.0/fullcalendar.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.2.0/locale/es.js"></script>

<script>
    $(document).ready(function() {
        // Obtenemos los eventos desde Django
        var eventosRaw = '{{ eventos_json|escapejs }}';
        var eventos = [];
        
        try {
            eventos = JSON.parse(eventosRaw);
        } catch (e) {
            console.error("Error al parsear eventos:", e);
        }

        $('#calendar').fullCalendar({
            locale: 'es',
            header: {
                left: 'prev,next today',
                center: 'title',
                right: 'month,agendaWeek'
            },
            height: 'auto',
            events: eventos,
            eventRender: function(event, element) {
                // Personalización de colores usando los nombres de color que envías desde el view
                if (event.color === 'green') {
                    element.css({'background-color': '#dcfce7', 'color': '#166534', 'border-left': '4px solid #22c55e'});
                } else if (event.color === 'red') {
                    element.css({'background-color': '#fee2e2', 'color': '#991b1b', 'border-left': '4px solid #ef4444'});
                } else if (event.color === 'blue') {
                    element.css({'background-color': '#dbeafe', 'color': '#1e40af', 'border-left': '4px solid #3b82f6'});
                }
                
                element.find('.fc-title').prepend('<i class="fa fa-money-bill-wave mr-1 opacity-50"></i> ');
            }
        });
    });
</script>
{% endblock %}
