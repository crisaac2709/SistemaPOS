{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Correo enviado</title>
    <!-- Solo si aún no compilas Tailwind localmente -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>

<!-- Fondo con imagen -->
<div class="relative min-h-screen bg-cover bg-center" style="background-image: url('{% static "media/4c6a36d0-5a0a-4846-82eb-ee4289995b27.png" %}');">
    <div class="absolute inset-0 bg-black bg-opacity-80 backdrop-blur-sm"></div>

    <!-- Contenido centrado -->
    <div class="relative z-10 flex items-center justify-center min-h-screen px-4">
        <div class="w-full max-w-xl bg-gray-900 bg-opacity-90 text-white p-10 rounded-3xl shadow-2xl ring-2 ring-yellow-500/60 border border-yellow-400/30 text-center">

            <!-- Icono animado -->
            <div class="text-5xl text-yellow-400 animate-pulse mb-4">📧</div>

            <!-- Título -->
            <h2 class="text-3xl font-extrabold text-yellow-400 mb-3">¡Correo enviado!</h2>

            <!-- Mensaje -->
            <p class="text-sm text-gray-300 mb-6 leading-relaxed">
                Te hemos enviado un enlace a tu correo electrónico para que puedas <strong class="text-yellow-300">restablecer tu contraseña</strong>.<br>
                Si no lo encuentras en unos minutos, revisa tu carpeta de <span class="text-yellow-400 font-semibold">spam</span> o vuelve a intentarlo más tarde.
            </p>

            <!-- Botón de regreso -->
            <a href="{% url 'usuarios:login' %}"
               class="inline-block bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold py-3 px-6 rounded-xl shadow-lg transition transform hover:-translate-y-0.5 duration-200">
               🔁 Volver al inicio de sesión
            </a>
        </div>
    </div>
</div>

</body>
</html>
