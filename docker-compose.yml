services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env  # <--- AQUÍ LE DECIMOS QUE LEA TU ARCHIVO .env
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: django_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env  # <--- TAMBIÉN PARA DJANGO
    depends_on:
      - db

volumes:
  postgres_data: